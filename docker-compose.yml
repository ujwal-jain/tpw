services:
  db:
    image: postgres:16
    container_name: tpw-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tpw
      POSTGRES_PASSWORD: tpw
      POSTGRES_DB: tpw
    ports:
      - "5432:5432"
    volumes:
      - tpw-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpw -d tpw"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  tpw-pgdata:
